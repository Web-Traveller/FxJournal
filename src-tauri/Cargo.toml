[package]
name = "fxjournal"
version = "0.1.0"
description = "FxJournal — Desktop Forex Trading Journal & Prop Firm HUD"
authors = ["Ajinkya"]
edition = "2024"

[lib]
name = "fxjournal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
